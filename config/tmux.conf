# agent-board's tmux server configuration. bin/_tc_bins.zsh passes it with -f whenever it talks to the
# dedicated server (tmux -L agent-board), so a server it starts loads this file in place of ~/.tmux.conf,
# which this file never sources. The hooks, options and bindings below therefore reach only agent-board's
# own sessions; the user's tmux server keeps its own configuration.
#
# Personal settings for this server (a prefix key, colours, more bindings) go in
# ~/.config/agent-board/tmux.local.conf, sourced at the end when it exists. The prefix is tmux's default C-b
# until that file changes it.
#
# AGENT_BOARD_REPO is the checkout whose scripts the hooks and bindings run. The scripts export it before
# they start the server; a server started by hand (tmux -L agent-board -f <this file>) falls back to ~/agent-board.
%if "#{==:$AGENT_BOARD_REPO,}"
AGENT_BOARD_REPO="$HOME/agent-board"
%endif

# --- hooks: why this server exists
# each agent-team teammate gets its own window "✦ name" instead of a split pane beside the lead
set-hook -g after-split-window "run-shell -b '$AGENT_BOARD_REPO/bin/tmux-teammate-window'"
# a project's state files (artifacts manifest, runs, feeds) go when its session closes; handoff lineage persists in ~/.local/state/agent-board/lineage/
set-hook -g session-closed "run-shell -b '$AGENT_BOARD_REPO/bin/tmux-session-closed #{q:hook_session_name}'"

# --- Claude Code in a pane: Shift+Enter newlines, notification passthrough
set -g allow-passthrough on
set -s extended-keys on
set -as terminal-features 'xterm*:extkeys'
# a waiting Claude rings the bell: that window's tab turns red (the board's "Needs you" works without this)
set -g monitor-bell on
set -g bell-action other
set -g visual-bell off

# --- bindings (prefix + key)
# D : project session for the current folder (the claude and plan windows; the agents' windows in <project>-bg)
bind D run-shell -b "DEV_CLIENT='#{client_name}' '$AGENT_BOARD_REPO/bin/dev' '#{pane_current_path}'"
# f : fuzzy-jump to any window of any session (tmux-jump opens itself in a popup on this client)
bind f run-shell -b "'$AGENT_BOARD_REPO/bin/tmux-jump' --popup '#{client_name}'"
# S : throwaway shell in a popup, in the session folder
bind S display-popup -E -w 80% -h 60% -d "#{session_path}" -T " shell " "$SHELL -l"
# W : pick finished agent worktrees to remove (never forces)
bind W display-popup -E -w 90% -h 60% -d "#{pane_current_path}" -T " clean up agent worktrees " "'$AGENT_BOARD_REPO/bin/tmux-agent-cleanup'"

source-file -q ~/.config/agent-board/tmux.local.conf
