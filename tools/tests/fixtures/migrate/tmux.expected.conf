# prefix and look
set -g prefix C-a
set -g mouse on
bind r source-file ~/.tmux.conf \; display 'reloaded'

# agent-board: clean up agent worktrees
set -s command-alias[100] 'agent-task=command-prompt -p "Task:" "set -g @agent_task \"%%%\" ; agent-go"'
set -s command-alias[101] 'agent-go=run-shell -b -c "#{pane_current_path}" "export TMUX=\"#{socket_path},#{pid},0\" TMUX_PANE=\"#{pane_id}\"; n=\"\$(~/.local/bin/tmux show -gqv @agent_name)\"; t=\"\$(~/.local/bin/tmux show -gqv @agent_task)\"; ~/.local/bin/tmux set -gu @agent_name; ~/.local/bin/tmux set -gu @agent_task; ~/.local/bin/tmux-ctl agent \"\$n\" \"\$t\""'
bind A command-prompt -p "Agent name:" "set -g @agent_name \"%%%\" ; if -F 1 agent-task"
bind m display-menu -T "menu" "Split" s "split-window"
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-restore 'on'
run '~/.tmux/plugins/tpm/tpm'
